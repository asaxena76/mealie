# Copy outside the checkout to the service directory as compose.carrie-ui.yaml.
# Verify the bridge subnet and reserve this IP before using the example.
services:
  mealie:
    environment:
      CARRIE_STOCK_GATEWAY_URL: http://172.22.0.1:18792
      CARRIE_STOCK_PUBLIC_ORIGIN: https://mealie.vagabond.in
      CARRIE_STOCK_FOCUSED_UI: "true"
      CARRIE_AGENT_ID: carrie
      CARRIE_HOUSEHOLD_ID: REPLACE_WITH_VERIFIED_HOUSEHOLD_UUID
      # The earlier native adapter is not enabled in production.
      CARRIE_GATEWAY_URL: ""
      CARRIE_GATEWAY_TOKEN: ""
    networks:
      default:
        ipv4_address: 172.22.0.2
networks:
  default:
    external: true
    name: mealie_default
